name: Validate

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: TS compile
        run: vp run compile

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Lint
        run: vp run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Code format
        run: vp run format --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore PostgreSQL download cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/postgres
          key: ${{ runner.os }}-${{ runner.arch }}-postgres-${{ hashFiles('scripts/install-deps.mjs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-postgres-

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install PostgreSQL binaries for real lifecycle tests
        run: node --input-type=module -e "import { installPostgres } from './scripts/install-deps.mjs'; await installPostgres();"

      - name: Test
        run: vp run test

      - name: Check if the English source strings have been extracted
        id: git-diff
        run: |
          vp run i18n:extract
          git diff --ignore-blank-lines src/ui/translations/en src/electron-main/translations/en
          echo "MODIFIED=$(if [ -n "$(git diff --ignore-blank-lines src/ui/translations/en src/electron-main/translations/en)" ]; then echo "true"; else echo "false"; fi)" >> "$GITHUB_OUTPUT"

      - name: Fail if the English source strings have not been extracted
        if: steps.git-diff.outputs.MODIFIED == 'true'
        run: |
          echo "::error title=Translations not up-to-date::The English source strings are not extracted. Please run 'vp run i18n:extract' and commit the changes."
          exit 1

      - name: Find dead code
        run: vp run deadcode

  embedded-postgres-package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore PostgreSQL download cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/postgres
          key: ${{ runner.os }}-${{ runner.arch }}-postgres-${{ hashFiles('scripts/install-deps.mjs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-postgres-

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Build application
        run: vp run build

      - name: Package application
        run: vp run package --dir --${{ matrix.arch }}

      - name: Test embedded PostgreSQL lifecycle
        run: vp test src/node/database/embedded

      - name: Smoke test packaged addon, PostgreSQL and CLI
        run: node ./scripts/smoke-packaged-embedded-postgres.mjs
